\* expect: pass
\* Four-revision/three-value projection safety (base and two different edits), arbitrary delivery; transport fairness is checked separately.
\* Config for MindMachineSync.tla. Current code: folded-head ancestry, branch deletes, incomplete-chain staging (tombstone names what it deletes, identical heads fold together, parents upload first): every rule holds.
SPECIFICATION ProjectionSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    MaxRev = 4
    MaxRoots = 1
    MaxCrash = 0
    Values = {"a", "b", "c"}
    TombstoneRule = "Ancestry"
    CollapseIdentical = TRUE
    UploadParentsFirst = FALSE
    RequireCompleteAncestry = TRUE
    FaultAckEarly = FALSE
INVARIANTS
    TypeOK
    DeletedStaysDeleted
    NoCapturedNoteLost
    DeleteSparesOtherCopies
    DeleteSparesUnseenEdits
    NoDuplicateCopies
    NoStaleCopyBesideNewer
