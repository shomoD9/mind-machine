# Native CI: builds and tests the Swift package and the Xcode app targets on GitHub-hosted macOS runners.
# Triggered by push to main, pull requests and manual runs (workflow_dispatch); nothing in the repo calls it.
# Documented in native/README.md ("Continuous integration"). No signing, TestFlight or secrets are used.
name: native-ci

on:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/native-ci.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native-ci.yml']
  workflow_dispatch:

# A newer run on the same ref replaces the older one, because macOS minutes cost about 10x Linux minutes.
concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # native/README.md records that all targets compile on Xcode 26.2.
  XCODE_VERSION: '26.2'

jobs:
  package-tests:
    name: swift test (MindMachineCore + MindMachineUI)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build-ci
          key: mm-spm-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ hashFiles('native/Package.swift', 'native/Sources/**', 'native/Tests/**') }}
          restore-keys: mm-spm-${{ runner.os }}-${{ env.XCODE_VERSION }}-
      - name: Release 10k search and durable capture benchmark
        run: set -o pipefail; swift test -c release --package-path native --scratch-path "$GITHUB_WORKSPACE/.build-release-ci" --filter SearchPerformanceTests | tee search-benchmark.txt
      - name: Kill recovery and concurrent-process capture
        run: |
          BIN=$(swift build -c release --package-path native --scratch-path "$GITHUB_WORKSPACE/.build-release-ci" --show-bin-path)
          python3 native/Scripts/verify_vault_processes.py "$BIN/VaultIntegrityProbe"
      - name: Same-corpus FTS5 versus MiniSearch resource comparison
        run: |
          set -o pipefail
          BIN=$(swift build -c release --package-path native --scratch-path "$GITHUB_WORKSPACE/.build-release-ci" --show-bin-path)
          mkdir -p "$RUNNER_TEMP/mm-search-comparison"
          "$BIN/VaultIntegrityProbe" seed "$RUNNER_TEMP/mm-search-comparison/vault.json"
          "$BIN/VaultIntegrityProbe" benchmark "$RUNNER_TEMP/mm-search-comparison/vault.json" | tee search-comparison.txt
          python3 native/Scripts/fetch_minisearch_probe.py "$RUNNER_TEMP/mm-search-comparison"
          swiftc -O -parse-as-library native/Benchmarks/MiniSearchComparison.swift -framework JavaScriptCore -o "$RUNNER_TEMP/mm-search-comparison/minisearch-probe"
          "$RUNNER_TEMP/mm-search-comparison/minisearch-probe" "$RUNNER_TEMP/mm-search-comparison/index.js" | tee -a search-comparison.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-benchmark
          path: |
            search-benchmark.txt
            search-comparison.txt
      - name: swift test
        run: swift test --package-path native --scratch-path "$GITHUB_WORKSPACE/.build-ci"
      # Pure pill logic (state machine, geometry, position persistence, motion) is a separate package.
      - name: swift test (MindMachinePill)
        run: swift test --package-path native/Pill --scratch-path "$GITHUB_WORKSPACE/.build-ci-pill"

  # The MindMachine scheme builds the iPhone app and, through its target dependency, the embedded keyboard extension.
  ios-build:
    name: xcodebuild iOS app + keyboard (Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: mm-dd-ios-${{ env.XCODE_VERSION }}-${{ hashFiles('native/Package.swift', 'native/Sources/**', 'native/Apps/**', 'native/MindMachine.xcodeproj/project.pbxproj') }}
          restore-keys: mm-dd-ios-${{ env.XCODE_VERSION }}-
      - name: Build MindMachine (includes MindMachineKeyboard)
        run: |
          xcodebuild -project native/MindMachine.xcodeproj -scheme MindMachine \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Confirm keyboard extension was embedded
        run: find DerivedData -name 'MindMachineKeyboard.appex' -maxdepth 6 | grep .
      - name: Verify expanded iPhone and keyboard identifiers
        run: |
          python3 native/Scripts/verify_bundle_configuration.py DerivedData/Build/Products/Debug-iphonesimulator/MindMachine.app com.statemachine.mindmachine
          python3 native/Scripts/verify_bundle_configuration.py DerivedData/Build/Products/Debug-iphonesimulator/MindMachine.app/PlugIns/MindMachineKeyboard.appex com.statemachine.mindmachine.keyboard

  mac-build:
    name: xcodebuild Mac app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: mm-dd-mac-${{ env.XCODE_VERSION }}-${{ hashFiles('native/Package.swift', 'native/Sources/**', 'native/Apps/**', 'native/Pill/**', 'native/MindMachine.xcodeproj/project.pbxproj') }}
          restore-keys: mm-dd-mac-${{ env.XCODE_VERSION }}-
      - name: Build MindMachineMac
        run: |
          xcodebuild -project native/MindMachine.xcodeproj -scheme MindMachineMac \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      # Launches the built app and drives the floating pill through its real window: window flags, expand,
      # tab shortcuts, typing, Esc, click-away, hotkey, hide/show, drag + persistence, Reduce Motion, timings.
      - name: Verify expanded Mac identifiers
        run: python3 native/Scripts/verify_bundle_configuration.py DerivedData/Build/Products/Debug/MindMachineMac.app com.statemachine.mindmachine.mac
      - name: Pill self-test
        run: |
          mkdir -p pill-selftest
          APP=$(find DerivedData -name MindMachineMac.app -maxdepth 6 | head -1)
          echo "Launching $APP"
          "$APP/Contents/MacOS/MindMachineMac" --pill-selftest "$PWD/pill-selftest/result.json" > pill-selftest/stdout.txt 2>&1 &
          PID=$!
          for i in $(seq 1 120); do kill -0 "$PID" 2>/dev/null || break; sleep 1; done
          if kill -0 "$PID" 2>/dev/null; then echo "self-test did not finish"; kill "$PID"; cat pill-selftest/stdout.txt; exit 1; fi
          STATUS=0
          wait "$PID" || STATUS=$?
          cat pill-selftest/stdout.txt
          exit $STATUS
      - name: Upload pill self-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pill-selftest
          path: pill-selftest
